name: DTC Provenance Runtime Gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  exact-head-dtc-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ISOLATED_RUNTIME_240: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_244: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 244 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-240-review' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_244_HEAD_SHA && vars.SKSK_ISOLATED_244_HEAD_SHA != '' }}
      ISOLATED_RUNTIME_241: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_243: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_246: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 246 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/retire-stripe-procurement' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_246_HEAD_SHA && vars.SKSK_ISOLATED_246_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_233: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 233 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'chore/remove-orphaned-ai-worker-bull' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_233_HEAD_SHA && vars.SKSK_ISOLATED_233_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_247: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 247 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/required-gates-always-trigger' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_247_HEAD_SHA && vars.SKSK_ISOLATED_247_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_245: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 245 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-241-243' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_245_HEAD_SHA && vars.SKSK_ISOLATED_245_HEAD_SHA != '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-241.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-243.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 246 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/retire-stripe-procurement' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_246_HEAD_SHA && vars.SKSK_ISOLATED_246_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-246.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 233 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'chore/remove-orphaned-ai-worker-bull' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_233_HEAD_SHA && vars.SKSK_ISOLATED_233_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-233.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 247 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/required-gates-always-trigger' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_247_HEAD_SHA && vars.SKSK_ISOLATED_247_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-247.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-240.onrender.com' || format('https://p613-backend-pr-{0}.onrender.com', github.event.pull_request.number) }}
      SKSK_PREVIEW_API_KEY: ${{ secrets.SKSK_PREVIEW_API_KEY }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Select exact-head PR #240 isolated runtime target"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        env:
          ISOLATED_240_API_KEY: ${{ secrets.SKSK_ISOLATED_240_API_KEY }}
        run: |
          if [ -z "$ISOLATED_240_API_KEY" ]; then
            echo "::error::SKSK_ISOLATED_240_API_KEY is missing; refusing to fall back to the default preview key."
            exit 1
          fi
          echo "SKSK_PREVIEW_API_KEY=$ISOLATED_240_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #240 isolated test target selected; runtime verification pending.'
          {
            echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
            echo 'PR #240 exact head 5a5cf160a3be1adbb236b5860228b58d77cceed7; test-only service https://p613-isolated-pr-240.onrender.com.'
            echo 'No HTTP runtime checks are waived. The selected target must pass exact commit and service-identity checks.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject unpinned PR 246 runtime target
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 246 && env.ISOLATED_RUNTIME_246 != 'true'
        run: |
          echo '::error::PR 246 requires its exact-head isolated target; refusing default preview fallback.'
          exit 1
      - name: Reject unpinned PR 233 runtime target
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 233 && env.ISOLATED_RUNTIME_233 != 'true'
        run: |
          echo '::error::PR 233 requires its exact-head isolated target; refusing default preview fallback.'
          exit 1
      - name: Reject unpinned PR 247 runtime target
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 247 && env.ISOLATED_RUNTIME_247 != 'true'
        run: |
          echo '::error::PR 247 requires its exact-head isolated target; refusing default preview fallback.'
          exit 1
      - name: "Select pinned PR #241/#243/#246/#233/#247 isolated runtime credential"
        if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true' || env.ISOLATED_RUNTIME_233 == 'true' || env.ISOLATED_RUNTIME_247 == 'true'
        env:
          ISOLATED_241_API_KEY: ${{ secrets.SKSK_ISOLATED_241_API_KEY }}
          ISOLATED_243_API_KEY: ${{ secrets.SKSK_ISOLATED_243_API_KEY }}
          ISOLATED_246_API_KEY: ${{ secrets.SKSK_ISOLATED_246_API_KEY }}
          ISOLATED_233_API_KEY: ${{ secrets.SKSK_ISOLATED_233_API_KEY }}
          ISOLATED_247_API_KEY: ${{ secrets.SKSK_ISOLATED_247_API_KEY }}
        run: |
          case "${ISOLATED_RUNTIME_241}:${ISOLATED_RUNTIME_243}:${ISOLATED_RUNTIME_246}:${ISOLATED_RUNTIME_233}:${ISOLATED_RUNTIME_247}" in
            true:false:false:false:false) TEST_KEY="$ISOLATED_241_API_KEY"; TARGET_PR=241 ;;
            false:true:false:false:false) TEST_KEY="$ISOLATED_243_API_KEY"; TARGET_PR=243 ;;
            false:false:true:false:false) TEST_KEY="$ISOLATED_246_API_KEY"; TARGET_PR=246 ;;
            false:false:false:true:false) TEST_KEY="$ISOLATED_233_API_KEY"; TARGET_PR=233 ;;
            false:false:false:false:true) TEST_KEY="$ISOLATED_247_API_KEY"; TARGET_PR=247 ;;
            *) echo '::error::Ambiguous isolated runtime selector; refusing credential selection.'; exit 1 ;;
          esac
          if [ -z "$TEST_KEY" ]; then
            echo "::error::SKSK_ISOLATED_${TARGET_PR}_API_KEY missing; refusing shared preview-key fallback."
            exit 1
          fi
          printf 'SKSK_PREVIEW_API_KEY=%s\n' "$TEST_KEY" >> "$GITHUB_ENV"
          echo "::notice::PR #${TARGET_PR} dedicated test credential selected; runtime verification pending."
          {
            echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
            echo "PR #${TARGET_PR} at pinned head $HEAD_SHA; target $PREVIEW_URL."
            echo 'Every real HTTP assertion remains mandatory. No runtime waiver is enabled.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Select pinned PR #245 isolated policy bootstrap credential"
        if: env.ISOLATED_RUNTIME_245 == 'true'
        env:
          ISOLATED_245_API_KEY: ${{ secrets.SKSK_ISOLATED_245_API_KEY }}
        run: |
          if [ -z "$ISOLATED_245_API_KEY" ]; then
            echo '::error::SKSK_ISOLATED_245_API_KEY missing; refusing shared preview-key fallback.'
            exit 1
          fi
          printf 'SKSK_PREVIEW_API_KEY=%s\n' "$ISOLATED_245_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #245 pinned bootstrap credential selected; live verification pending.'
          {
            echo '### PR #245 POLICY BOOTSTRAP SELECTED — NOT YET VERIFIED'
            echo "PR #245 at exact head $HEAD_SHA, pinned by SKSK_ISOLATED_245_HEAD_SHA."
            echo 'Test-only service https://p613-backend-pr-245.onrender.com; no runtime waiver.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Select pinned PR #244 isolated bootstrap credential"
        if: env.ISOLATED_RUNTIME_244 == 'true'
        env:
          ISOLATED_244_API_KEY: ${{ secrets.SKSK_ISOLATED_244_API_KEY }}
        run: |
          if [ -z "$ISOLATED_244_API_KEY" ]; then
            echo "::error::SKSK_ISOLATED_244_API_KEY missing; refusing shared preview-key fallback."
            exit 1
          fi
          echo "SKSK_PREVIEW_API_KEY=$ISOLATED_244_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #244 pinned test credential selected; runtime verification pending.'
          {
            echo '### PR #244 BOOTSTRAP TARGET SELECTED — NOT YET VERIFIED'
            echo "PR #244 exact head $HEAD_SHA, pinned by repository variable SKSK_ISOLATED_244_HEAD_SHA."
            echo 'Test-only service https://p613-backend-pr-244.onrender.com; no runtime waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact Render preview head
        run: |
          MATCHED=0
          for attempt in $(seq 1 48); do
            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 10 -sS -o /tmp/dtc-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              if HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/dtc-health.json', 'utf8'));
          if (health?.preview?.commit !== process.env.HEAD_SHA) {
            console.error(`preview commit ${health?.preview?.commit || 'missing'} != ${process.env.HEAD_SHA}`);
            process.exit(1);
          }
          NODE
              then
                MATCHED=1
                break
              fi
            fi
            echo "Preview not on exact head yet (attempt $attempt/48, HTTP $HTTP_CODE)."
            sleep 5
          done

          if [ "$MATCHED" != "1" ]; then
            echo "Render preview never reached exact PR head $HEAD_SHA."
            cat /tmp/dtc-health.json 2>/dev/null || true
            exit 1
          fi

      - name: "Verify PR #245 isolated policy bootstrap identity"
        if: env.ISOLATED_RUNTIME_245 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-245-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #245 bootstrap health unavailable (HTTP $HTTP_CODE)."; exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-245-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-245') {
            console.error('PR #245 bootstrap identity, health or exact head mismatch; refusing runtime verification.');
            process.exit(1);
          }
          NODE
      - name: "Verify PR #241/#243/#246/#233/#247 isolated service identity"
        if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true' || env.ISOLATED_RUNTIME_233 == 'true' || env.ISOLATED_RUNTIME_247 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-241-243-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Isolated runtime health unavailable (HTTP $HTTP_CODE)."; exit 1
          fi
          HEAD_SHA="$HEAD_SHA" ISOLATED_RUNTIME_241="$ISOLATED_RUNTIME_241" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-241-243-isolated-health.json', 'utf8'));
          const service = process.env.ISOLATED_RUNTIME_241 === 'true' ? 'p613-isolated-pr-241' : process.env.ISOLATED_RUNTIME_243 === 'true' ? 'p613-isolated-pr-243' : process.env.ISOLATED_RUNTIME_246 === 'true' ? 'p613-isolated-pr-246' : process.env.ISOLATED_RUNTIME_233 === 'true' ? 'p613-isolated-pr-233' : 'p613-isolated-pr-247';
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== service) {
            console.error('Isolated service name, exact head, or runtime health mismatch; refusing verification.');
            process.exit(1);
          }
          NODE
      - name: "Verify PR #240 isolated service identity"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-240-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #240 isolated runtime health unavailable (HTTP $HTTP_CODE)."
            exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-240-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-isolated-pr-240') {
            console.error('Isolated test service identity or exact commit did not match; refusing runtime verification.');
            process.exit(1);
          }
          NODE

      - name: "Verify PR #244 isolated test service identity"
        if: env.ISOLATED_RUNTIME_244 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-244-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #244 isolated test service health unavailable (HTTP $HTTP_CODE)."
            exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-244-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-244') {
            console.error('PR #244 test service identity or exact commit mismatch; runtime is not verified.');
            process.exit(1);
          }
          NODE

      - name: Prove mixed DTC provenance on real Diagnose route
        run: |
          cat > /tmp/dtc-request.json <<'JSON'
          {
            "vehicle": {"year": 2016, "make": "Chevrolet", "model": "Malibu", "engine": "2.5L"},
            "customerStates": ["Intermittent rough idle; diagnostic provenance runtime canary"],
            "mechanicNotices": ["No repair authorization; test-only runtime request"],
            "dtcEvidence": [
              {"code": "P0300", "source": "SCAN_TOOL", "verified": true},
              {"code": "P0171", "source": "PLACEHOLDER", "verified": false},
              {"code": "U0100", "source": "MANUAL_ENTRY", "verified": false}
            ]
          }
          JSON

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 90 -sS -o /tmp/dtc-diagnose.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data-binary @/tmp/dtc-request.json \
            "$PREVIEW_URL/api/diagnose" || true)"
          cat /tmp/dtc-diagnose.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Diagnose DTC provenance canary failed with HTTP $HTTP_CODE."
            exit 1
          fi

          JOB_ID="$(node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/dtc-diagnose.json', 'utf8'));
          const failures = [];
          if (body.success !== true) failures.push('success !== true');
          if (!body.jobId) failures.push('jobId missing');
          if (body.result?.dtcProvenance?.policy !== 'VERIFIED_SCAN_TOOL_ONLY') failures.push(`policy ${body.result?.dtcProvenance?.policy}`);
          if (body.result?.dtcProvenance?.verifiedCount !== 1) failures.push(`verifiedCount ${body.result?.dtcProvenance?.verifiedCount}`);
          if (body.result?.dtcProvenance?.excludedCount !== 2) failures.push(`excludedCount ${body.result?.dtcProvenance?.excludedCount}`);
          const explanationKeys = Object.keys(body.result?.codeExplanations || {});
          if (explanationKeys.some(code => code !== 'P0300')) failures.push(`untrusted code explanation leaked: ${explanationKeys.join(',')}`);
          const trace = Array.isArray(body.traceLog?.logs) ? body.traceLog.logs.join(' ') : '';
          if (!/2 entered DTC record\(s\) excluded/i.test(trace)) failures.push('exclusion trace missing');
          if (failures.length) {
            console.error(failures.join('; '));
            process.exit(1);
          }
          process.stdout.write(body.jobId);
          NODE
          )"

          ENCODED_JOB_ID="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$JOB_ID")"
          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 20 -sS -o /tmp/dtc-job.json -w '%{http_code}' \
            "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID" || true)"
          cat /tmp/dtc-job.json || true
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Persisted DTC provenance job fetch failed with HTTP $HTTP_CODE."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/dtc-job.json', 'utf8'));
          const job = body.job || {};
          const failures = [];
          if (JSON.stringify(job.intake?.obdCodes || []) !== JSON.stringify(['P0300'])) {
            failures.push(`trusted intake obdCodes ${JSON.stringify(job.intake?.obdCodes)}`);
          }
          const audit = Array.isArray(job.intake?.dtcEvidence) ? job.intake.dtcEvidence : [];
          const auditByCode = Object.fromEntries(audit.map(item => [item.code, item]));
          if (auditByCode.P0300?.source !== 'SCAN_TOOL' || auditByCode.P0300?.verified !== true) failures.push('P0300 trusted audit provenance missing');
          if (auditByCode.P0171?.source !== 'PLACEHOLDER' || auditByCode.P0171?.verified !== false) failures.push('P0171 placeholder audit provenance missing');
          if (auditByCode.U0100?.source !== 'MANUAL_ENTRY' || auditByCode.U0100?.verified !== false) failures.push('U0100 manual audit provenance missing');

          const packet = job.diagnosis?.evidencePacket || {};
          if (packet.schemaVersion !== 2) failures.push(`packet schemaVersion ${packet.schemaVersion}`);
          if (packet.dtcProvenance?.policy !== 'VERIFIED_SCAN_TOOL_ONLY') failures.push(`packet policy ${packet.dtcProvenance?.policy}`);
          if (Object.hasOwn(packet.dtcProvenance || {}, 'records')) failures.push('model-facing provenance unexpectedly exposes audit records');
          if (JSON.stringify(packet.dtcs || []) !== JSON.stringify(['P0300'])) failures.push(`packet dtcs ${JSON.stringify(packet.dtcs)}`);

          if (failures.length) {
            console.error(failures.join('; '));
            process.exit(1);
          }
          console.log('DTC provenance runtime passed: P0300 trusted; P0171/U0100 audit-only; diagnostic DTC slot trusted-only.');
          NODE

      - name: "Audit PR #245 isolated policy bootstrap runtime success"
        if: env.ISOLATED_RUNTIME_245 == 'true' && success()
        run: |
          {
            echo '### RUNTIME VERIFIED AGAINST ISOLATED TEST SERVICE'
            echo "PR #245 exact policy head $HEAD_SHA matched the repository pin."
            echo 'Target: https://p613-backend-pr-245.onrender.com; health.ok, service name and commit matched.'
            echo 'All actual HTTP checks in this workflow passed; no runtime waiver was used.'
            echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Audit PR #241/#243/#246/#233/#247 isolated runtime success"
        if: (env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true' || env.ISOLATED_RUNTIME_233 == 'true' || env.ISOLATED_RUNTIME_247 == 'true') && success()
        run: |
          if [ "$ISOLATED_RUNTIME_241" = 'true' ]; then TARGET_PR=241; elif [ "$ISOLATED_RUNTIME_243" = 'true' ]; then TARGET_PR=243; elif [ "$ISOLATED_RUNTIME_246" = 'true' ]; then TARGET_PR=246; elif [ "$ISOLATED_RUNTIME_233" = 'true' ]; then TARGET_PR=233; else TARGET_PR=247; fi
          {
            echo '### RUNTIME VERIFIED AGAINST ISOLATED TEST SERVICE'
            echo "PR #${TARGET_PR} at pinned exact head $HEAD_SHA."
            echo "Target: $PREVIEW_URL; health.ok, commit and Render service identity matched."
            echo 'All required live HTTP assertions in this workflow passed; no runtime waiver was used.'
            echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Audit PR #244 pinned bootstrap runtime success"
        if: env.ISOLATED_RUNTIME_244 == 'true' && success()
        run: |
          {
            echo '### RUNTIME VERIFIED AGAINST ISOLATED TEST SERVICE'
            echo "PR #244 exact head $HEAD_SHA matched the reviewed repository pin."
            echo 'Target https://p613-backend-pr-244.onrender.com; health.ok, service identity, and commit matched.'
            echo 'This workflow executed its real HTTP runtime assertions successfully; no waiver was used.'
