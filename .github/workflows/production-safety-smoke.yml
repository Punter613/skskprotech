name: Production Safety Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://p613-backend.onrender.com
      SKSK_TEST_API_KEY: ${{ secrets.SKSK_TEST_API_KEY }}
    steps:
      - name: Public health and persistence
        run: |
          code="$(curl --connect-timeout 10 --max-time 45 -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/health")"
          cat /tmp/health.json
          test "$code" = "200"
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(h.ok !== true) throw new Error('health.ok is not true');
          if(!h.database || h.database.ok !== true) throw new Error('database probe is not healthy');
          NODE

      - name: Retired full-estimate boundary stays non-live
        run: |
          code="$(curl --connect-timeout 10 --max-time 45 -sS -o /tmp/retired.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$BASE_URL/api/full-estimate")"
          cat /tmp/retired.json
          case "$code" in
            404|410) ;;
            *)
              echo "::error::Retired /api/full-estimate must not be a live estimator; got HTTP $code"
              exit 1
              ;;
          esac
          node - <<'NODE'
          const fs = require('fs');
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/retired.json', 'utf8')); } catch {}
          if (body && (body.success === true || body.estimate || body.total != null)) {
            throw new Error('retired /api/full-estimate returned estimate-shaped success');
          }
          NODE

      - name: Protected AI route fails safely without spending provider tokens
        run: |
          code="$(curl --connect-timeout 10 --max-time 45 -sS -o /tmp/auth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$BASE_URL/api/diagnose")"
          cat /tmp/auth.json
          if [ "$code" != "401" ] && [ "$code" != "400" ]; then
            echo "::error::Expected 401 when production auth is enforced, or transitional 400 while enforcement is intentionally disabled; got $code"
            exit 1
          fi

      - name: Authenticated test-key lane reaches validation without provider spend
        if: ${{ env.SKSK_TEST_API_KEY != '' }}
        run: |
          code="$(curl --connect-timeout 10 --max-time 45 -sS -o /tmp/test-key.json -w '%{http_code}' -H "X-SKSK-API-Key: $SKSK_TEST_API_KEY" "$BASE_URL/health/auth-test")"
          cat /tmp/test-key.json
          if [ "$code" != "200" ]; then
            echo "::error::Expected authenticated test probe to return 200; got $code"
            exit 1
          fi

      - name: Require configured test key when production test lane is enabled
        if: ${{ env.SKSK_TEST_API_KEY == '' }}
        run: |
          echo "::notice::SKSK_TEST_API_KEY repository secret is not configured; authenticated production smoke is skipped."
