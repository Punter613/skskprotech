name: Common Vehicle Knowledge Builder Runtime Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/services/common.vehicle.knowledge.builder.js'
      - 'src/routes/knowledge.builder.js'
      - 'src/routes/oem.js'
      - 'public/knowledge-builder.html'
      - 'public/_redirects'
      - 'scripts/plan-common-vehicle-ingestion.js'
      - 'tests/common.vehicle.knowledge.builder.test.js'
      - 'package.json'
      - 'api/.render-preview-trigger'
      - '.github/workflows/common-vehicle-knowledge-runtime.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-knowledge-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NO_PREVIEW_WAIVER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 238 && github.event.pull_request.head.sha == 'e04a7f826a6eb5e83d846d0766380a668160959e' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      NO_PREVIEW_WAIVER_237: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 237 && github.event.pull_request.head.sha == '1b51331dfaa5f48626455ee81e9f930e63fa55aa' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      ISOLATED_RUNTIME_240: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-240.onrender.com' || format('https://p613-backend-pr-{0}.onrender.com', github.event.pull_request.number) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Run deterministic knowledge builder tests
        run: npm install --ignore-scripts && npm run test:knowledge-builder

      - name: "Audit explicit PR #238 runtime waiver"
        if: env.NO_PREVIEW_WAIVER == 'true'
        run: |
          echo '::warning::PR #238 exact-head Render runtime checks WAIVED, not executed or verified.'
          {
            echo '### Render runtime: WAIVED — NOT VERIFIED'
            echo 'PR #238 at reviewed head e04a7f826a6eb5e83d846d0766380a668160959e; explicit no-preview label.'
            echo 'Reason: Render previews suspended after inheriting production database credentials.'
            echo 'Only live-preview checks are waived; deterministic steps remain mandatory where present.'
            echo 'See .github/NO_PREVIEW_WAIVER.md. No HTTP failure can grant this waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Audit explicit PR #237 startup-guard waiver"
        if: env.NO_PREVIEW_WAIVER_237 == 'true'
        run: |
          echo '::warning::PR #237 STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME WAIVED, NOT VERIFIED.'
          {
            echo '### PR #237: STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME NOT VERIFIED'
            echo 'Reviewed exact head: 1b51331dfaa5f48626455ee81e9f930e63fa55aa; explicit owner-applied no-preview label.'
            echo 'Isolated Render service: p613-isolated-pr-237; production URL + fabricated JWT refused before binding (exit 1).'
            echo 'Approved test-ref startup also logged; no valid Supabase key was used.'
            echo 'Evidence: https://github.com/Punter613/skskprotech/pull/237#issuecomment-6999629745'
            echo 'Only preview-dependent HTTP steps waived. Deterministic checks remain mandatory; no 404 or timeout can grant this waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Select exact-head PR #240 isolated runtime target"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        env:
          ISOLATED_240_API_KEY: ${{ secrets.SKSK_ISOLATED_240_API_KEY }}
        run: |
          if [ -z "$ISOLATED_240_API_KEY" ]; then
            echo "::error::SKSK_ISOLATED_240_API_KEY is missing; refusing to fall back to the default preview key."
            exit 1
          fi
          echo "SKSK_PREVIEW_API_KEY=$ISOLATED_240_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #240 isolated test target selected; runtime verification pending.'
          {
            echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
            echo 'PR #240 exact head 5a5cf160a3be1adbb236b5860228b58d77cceed7; test-only service https://p613-isolated-pr-240.onrender.com.'
            echo 'No HTTP runtime checks are waived. The selected target must pass exact commit and service-identity checks.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact Render preview head
        if: env.NO_PREVIEW_WAIVER != 'true' && env.NO_PREVIEW_WAIVER_237 != 'true'
        shell: bash
        run: |
          MATCHED=0
          for attempt in $(seq 1 48); do
            HTTP_CODE="$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/kb-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              if HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/kb-health.json', 'utf8'));
          if (health?.preview?.commit !== process.env.HEAD_SHA) process.exit(1);
          NODE
              then MATCHED=1; break; fi
            fi
            echo "Preview not on exact head yet (attempt $attempt/48, HTTP $HTTP_CODE)."
            sleep 5
          done
          if [ "$MATCHED" != "1" ]; then
            echo "Render preview never reached exact PR head $HEAD_SHA."
            cat /tmp/kb-health.json 2>/dev/null || true
            exit 1
          fi

      - name: "Verify PR #240 isolated service identity"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-240-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #240 isolated runtime health unavailable (HTTP $HTTP_CODE)."
            exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-240-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-isolated-pr-240') {
            console.error('Isolated test service identity or exact commit did not match; refusing runtime verification.');
            process.exit(1);
          }
          NODE

      - name: Prove durable-first coverage planner on live preview
        if: env.NO_PREVIEW_WAIVER != 'true' && env.NO_PREVIEW_WAIVER_237 != 'true'
        shell: bash
        run: |
          fetch_preview() {
            local url="$1"
            local outfile="$2"
            local timeout="$3"
            local code=000
            for attempt in $(seq 1 10); do
              code="$(curl --connect-timeout 5 --max-time "$timeout" -sS -o "$outfile" -w '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ]; then
                echo 200
                return 0
              fi
              echo "Preview route miss for $url (attempt $attempt/10, HTTP $code)." >&2
              cat "$outfile" 2>/dev/null >&2 || true
              # Reconfirm that the preview identity still reports the exact head;
              # this retry handles transient Render preview route misses without
              # accepting a persistent missing route or a stale commit.
              HEALTH_CODE="$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/kb-health-recheck.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
              if [ "$HEALTH_CODE" = "200" ]; then
                HEAD_SHA="$HEAD_SHA" node - <<'NODE' || exit 1
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/kb-health-recheck.json', 'utf8'));
          if (health?.preview?.commit !== process.env.HEAD_SHA) process.exit(1);
          NODE
              fi
              sleep 2
            done
            echo "$code"
            return 1
          }

          CATALOG_HTTP="$(fetch_preview "$PREVIEW_URL/api/knowledge-builder/catalog" /tmp/kb-catalog.json 30 || true)"
          COVERAGE_HTTP="$(fetch_preview "$PREVIEW_URL/api/knowledge-builder/coverage?make=Kia&model=Sorento&limit=5" /tmp/kb-coverage.json 90 || true)"
          PAGE_HTTP="$(fetch_preview "$PREVIEW_URL/knowledge-builder.html" /tmp/kb-page.html 30 || true)"

          if [ "$CATALOG_HTTP" != "200" ] || [ "$COVERAGE_HTTP" != "200" ] || [ "$PAGE_HTTP" != "200" ]; then
            echo "Knowledge Builder runtime HTTP failure: catalog=$CATALOG_HTTP coverage=$COVERAGE_HTTP page=$PAGE_HTTP"
            cat /tmp/kb-catalog.json 2>/dev/null || true
            cat /tmp/kb-coverage.json 2>/dev/null || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('/tmp/kb-catalog.json', 'utf8'));
          const coverage = JSON.parse(fs.readFileSync('/tmp/kb-coverage.json', 'utf8'));
          const page = fs.readFileSync('/tmp/kb-page.html', 'utf8');
          const failures = [];
          if (catalog.success !== true) failures.push('catalog success missing');
          if (catalog.policy !== 'DURABLE_FIRST_STRUCTURED_CORPUS') failures.push(`catalog policy ${catalog.policy}`);
          if (!Array.isArray(catalog.platforms) || catalog.platforms.length < 10) failures.push('common platform catalog too small');
          if (coverage.success !== true) failures.push('coverage success missing');
          if (coverage.policy !== 'DURABLE_FIRST_STRUCTURED_CORPUS') failures.push(`coverage policy ${coverage.policy}`);
          if (coverage.sourceRules?.optionalExternalCountsTowardDurableCoverage !== false) failures.push('optional source durable rule missing');
          if (coverage.sourceRules?.rawOptionalManualContentReturned !== false) failures.push('raw optional manual boundary missing');
          if (!Array.isArray(coverage.items) || coverage.items.length < 1 || coverage.items.length > 5) failures.push(`unexpected filtered item count ${coverage.items?.length}`);
          for (const item of coverage.items || []) {
            if (item.make !== 'Kia' || item.model !== 'Sorento') failures.push(`filter leak ${item.year} ${item.make} ${item.model}`);
            if (!Array.isArray(item.gaps) || !Array.isArray(item.recommendedActions)) failures.push('gap/action arrays missing');
            if (typeof item.coverageScore !== 'number' || typeof item.priorityScore !== 'number') failures.push('coverage/priority score missing');
          }
          if (!page.includes('SKSK <span>Knowledge Builder</span>')) failures.push('dashboard identity missing');
          if (!page.includes('Durable-first rule')) failures.push('dashboard durable-first copy missing');
          if (failures.length) {
            console.error(failures.join('; '));
            process.exit(1);
          }
          console.log(`Knowledge Builder runtime passed: ${coverage.items.length} filtered targets, durable policy intact, optional manuals excluded from durable readiness.`);
          NODE

      - name: "Audit PR #240 isolated test runtime success"
        if: env.ISOLATED_RUNTIME_240 == 'true' && success()
        run: |
          {
            echo '### RUNTIME VERIFIED AGAINST ISOLATED TEST SERVICE'
            echo 'PR #240 at exact reviewed head 5a5cf160a3be1adbb236b5860228b58d77cceed7.'
            echo 'Target: https://p613-isolated-pr-240.onrender.com; exact commit and Render service identity matched.'
            echo 'This workflow executed its real HTTP runtime assertions successfully; no runtime waiver was used.'
            echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
