name: Build Scraper Binary

# Compile check only. The binary was removed from the tree in #186
# (Milestone C spine deletions) and bin/lemon_scraper is gitignored,
# so committing it back to main fails every push. Nothing in api/,
# public/ or functions/ loads it. Build it, keep it as a run artifact.

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/lemon_scraper/**'
      - '.github/workflows/lemon_scraper.yaml'
  pull_request:
    paths:
      - 'tools/lemon_scraper/**'
      - '.github/workflows/lemon_scraper.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup default stable

      - name: Build release binary
        run: cargo build --release --locked --manifest-path=tools/lemon_scraper/Cargo.toml

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemon_scraper-x86_64-linux
          path: tools/lemon_scraper/target/release/lemon_scraper
          if-no-files-found: error
          retention-days: 14
