name: Customer Estimate Center Runtime Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [ main ]
    paths:
      - 'src/services/customer.estimate.center.js'
      - 'src/routes/customer.estimate.center.js'
      - 'src/routes/jobs.protected.js'
      - 'public/estimate-center.html'
      - 'public/_redirects'
      - 'tests/customer.estimate.center.test.js'
      - 'tests/frontend.customer.estimate.center.test.js'
      - 'tests/frontend.lifecycle.recall.test.js'
      - 'package.json'
      - 'api/.render-preview-trigger'
      - '.github/workflows/customer-estimate-runtime.yaml'

jobs:
  exact-head-customer-estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NO_PREVIEW_WAIVER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 238 && github.event.pull_request.head.sha == 'e04a7f826a6eb5e83d846d0766380a668160959e' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      NO_PREVIEW_WAIVER_237: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 237 && github.event.pull_request.head.sha == '1b51331dfaa5f48626455ee81e9f930e63fa55aa' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      ISOLATED_RUNTIME_240: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_244: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 244 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-240-review' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_244_HEAD_SHA && vars.SKSK_ISOLATED_244_HEAD_SHA != '' }}
      ISOLATED_RUNTIME_241: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_243: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_246: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 246 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/retire-stripe-procurement' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_246_HEAD_SHA && vars.SKSK_ISOLATED_246_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_245: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 245 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-241-243' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_245_HEAD_SHA && vars.SKSK_ISOLATED_245_HEAD_SHA != '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-241.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-243.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 246 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/retire-stripe-procurement' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_246_HEAD_SHA && vars.SKSK_ISOLATED_246_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-246.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-240.onrender.com' || format('https://p613-backend-pr-{0}.onrender.com', github.event.pull_request.number) }}
      SKSK_PREVIEW_API_KEY: ${{ secrets.SKSK_PREVIEW_API_KEY }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Audit explicit PR #238 runtime waiver"
        if: env.NO_PREVIEW_WAIVER == 'true'
        run: |
          echo '::warning::PR #238 exact-head Render runtime checks WAIVED, not executed or verified.'
          {
            echo '### Render runtime: WAIVED — NOT VERIFIED'
            echo 'PR #238 at reviewed head e04a7f826a6eb5e83d846d0766380a668160959e; explicit no-preview label.'
            echo 'Reason: Render previews suspended after inheriting production database credentials.'
            echo 'Only live-preview checks are waived; deterministic steps remain mandatory where present.'
            echo 'See .github/NO_PREVIEW_WAIVER.md. No HTTP failure can grant this waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Audit explicit PR #237 startup-guard waiver"
        if: env.NO_PREVIEW_WAIVER_237 == 'true'
        run: |
          echo '::warning::PR #237 STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME WAIVED, NOT VERIFIED.'
          {
            echo '### PR #237: STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME NOT VERIFIED'
            echo 'Reviewed exact head: 1b51331dfaa5f48626455ee81e9f930e63fa55aa; explicit owner-applied no-preview label.'
            echo 'Isolated Render service: p613-isolated-pr-237; production URL + fabricated JWT refused before binding (exit 1).'
            echo 'Approved test-ref startup also logged; no valid Supabase key was used.'
            echo 'Evidence: https://github.com/Punter613/skskprotech/pull/237#issuecomment-6999629745'
            echo 'Only preview-dependent HTTP steps waived. Deterministic checks remain mandatory; no 404 or timeout can grant this waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Select exact-head PR #240 isolated runtime target"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        env:
          ISOLATED_240_API_KEY: ${{ secrets.SKSK_ISOLATED_240_API_KEY }}
        run: |
          if [ -z "$ISOLATED_240_API_KEY" ]; then
            echo "::error::SKSK_ISOLATED_240_API_KEY is missing; refusing to fall back to the default preview key."
            exit 1
          fi
          echo "SKSK_PREVIEW_API_KEY=$ISOLATED_240_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #240 isolated test target selected; runtime verification pending.'
          {
            echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
            echo 'PR #240 exact head 5a5cf160a3be1adbb236b5860228b58d77cceed7; test-only service https://p613-isolated-pr-240.onrender.com.'
            echo 'No HTTP runtime checks are waived. The selected target must pass exact commit and service-identity checks.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject unpinned PR 246 runtime target
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 246 && env.ISOLATED_RUNTIME_246 != 'true'
        run: |
          echo '::error::PR 246 requires its exact-head isolated target; refusing default preview fallback.'
          exit 1
      - name: "Select pinned PR #241/#243/#246 isolated runtime credential"
        if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true'
        env:
          ISOLATED_241_API_KEY: ${{ secrets.SKSK_ISOLATED_241_API_KEY }}
          ISOLATED_243_API_KEY: ${{ secrets.SKSK_ISOLATED_243_API_KEY }}
          ISOLATED_246_API_KEY: ${{ secrets.SKSK_ISOLATED_246_API_KEY }}
        run: |
          case "${ISOLATED_RUNTIME_241}:${ISOLATED_RUNTIME_243}:${ISOLATED_RUNTIME_246}" in
            true:false:false) TEST_KEY="$ISOLATED_241_API_KEY"; TARGET_PR=241 ;;
            false:true:false) TEST_KEY="$ISOLATED_243_API_KEY"; TARGET_PR=243 ;;
            false:false:true) TEST_KEY="$ISOLATED_246_API_KEY"; TARGET_PR=246 ;;
            *) echo '::error::Ambiguous isolated runtime selector; refusing credential selection.'; exit 1 ;;
          esac
          if [ -z "$TEST_KEY" ]; then
            echo "::error::SKSK_ISOLATED_${TARGET_PR}_API_KEY missing; refusing shared preview-key fallback."
            exit 1
          fi
          printf 'SKSK_PREVIEW_API_KEY=%s\n' "$TEST_KEY" >> "$GITHUB_ENV"
          echo "::notice::PR #${TARGET_PR} dedicated test credential selected; runtime verification pending."
          {
            echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
            echo "PR #${TARGET_PR} at pinned head $HEAD_SHA; target $PREVIEW_URL."
            echo 'Every real HTTP assertion remains mandatory. No runtime waiver is enabled.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Select pinned PR #245 isolated policy bootstrap credential"
        if: env.ISOLATED_RUNTIME_245 == 'true'
        env:
          ISOLATED_245_API_KEY: ${{ secrets.SKSK_ISOLATED_245_API_KEY }}
        run: |
          if [ -z "$ISOLATED_245_API_KEY" ]; then
            echo '::error::SKSK_ISOLATED_245_API_KEY missing; refusing shared preview-key fallback.'
            exit 1
          fi
          printf 'SKSK_PREVIEW_API_KEY=%s\n' "$ISOLATED_245_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #245 pinned bootstrap credential selected; live verification pending.'
          {
            echo '### PR #245 POLICY BOOTSTRAP SELECTED — NOT YET VERIFIED'
            echo "PR #245 at exact head $HEAD_SHA, pinned by SKSK_ISOLATED_245_HEAD_SHA."
            echo 'Test-only service https://p613-backend-pr-245.onrender.com; no runtime waiver.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Select pinned PR #244 isolated bootstrap credential"
        if: env.ISOLATED_RUNTIME_244 == 'true'
        env:
          ISOLATED_244_API_KEY: ${{ secrets.SKSK_ISOLATED_244_API_KEY }}
        run: |
          if [ -z "$ISOLATED_244_API_KEY" ]; then
            echo "::error::SKSK_ISOLATED_244_API_KEY missing; refusing shared preview-key fallback."
            exit 1
          fi
          echo "SKSK_PREVIEW_API_KEY=$ISOLATED_244_API_KEY" >> "$GITHUB_ENV"
          echo '::notice::PR #244 pinned test credential selected; runtime verification pending.'
          {
            echo '### PR #244 BOOTSTRAP TARGET SELECTED — NOT YET VERIFIED'
            echo "PR #244 exact head $HEAD_SHA, pinned by repository variable SKSK_ISOLATED_244_HEAD_SHA."
            echo 'Test-only service https://p613-backend-pr-244.onrender.com; no runtime waiver.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for exact Render preview head
        if: env.NO_PREVIEW_WAIVER != 'true' && env.NO_PREVIEW_WAIVER_237 != 'true'
        run: |
          MATCHED=0
          for attempt in $(seq 1 60); do
            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 10 -sS -o /tmp/estimate-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              if HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/estimate-health.json', 'utf8'));
          process.exit(health?.preview?.commit === process.env.HEAD_SHA ? 0 : 1);
          NODE
              then
                MATCHED=1
                break
              fi
            fi
            echo "Estimate preview not ready on exact head (attempt $attempt/60, HTTP $HTTP_CODE)."
            sleep 5
          done
          if [ "$MATCHED" != "1" ]; then
            echo "::error::Customer Estimate runtime requires exact Render PR head $HEAD_SHA."
            cat /tmp/estimate-health.json 2>/dev/null || true
            exit 1
          fi

      - name: "Verify PR #245 isolated policy bootstrap identity"
        if: env.ISOLATED_RUNTIME_245 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-245-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #245 bootstrap health unavailable (HTTP $HTTP_CODE)."; exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-245-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-245') {
            console.error('PR #245 bootstrap identity, health or exact head mismatch; refusing runtime verification.');
            process.exit(1);
          }
          NODE
      - name: "Verify PR #241/#243/#246 isolated service identity"
        if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-241-243-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Isolated runtime health unavailable (HTTP $HTTP_CODE)."; exit 1
          fi
          HEAD_SHA="$HEAD_SHA" ISOLATED_RUNTIME_241="$ISOLATED_RUNTIME_241" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-241-243-isolated-health.json', 'utf8'));
          const service = process.env.ISOLATED_RUNTIME_241 === 'true' ? 'p613-isolated-pr-241' : process.env.ISOLATED_RUNTIME_243 === 'true' ? 'p613-isolated-pr-243' : 'p613-isolated-pr-246';
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== service) {
            console.error('Isolated service name, exact head, or runtime health mismatch; refusing verification.');
            process.exit(1);
          }
          NODE
      - name: "Verify PR #240 isolated service identity"
        if: env.ISOLATED_RUNTIME_240 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-240-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #240 isolated runtime health unavailable (HTTP $HTTP_CODE)."
            exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-240-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-isolated-pr-240') {
            console.error('Isolated test service identity or exact commit did not match; refusing runtime verification.');
            process.exit(1);
          }
          NODE

      - name: "Verify PR #244 isolated test service identity"
        if: env.ISOLATED_RUNTIME_244 == 'true'
        run: |
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-244-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PR #244 isolated test service health unavailable (HTTP $HTTP_CODE)."
            exit 1
          fi
          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/pr-244-isolated-health.json', 'utf8'));
          if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-244') {
            console.error('PR #244 test service identity or exact commit mismatch; runtime is not verified.');
            process.exit(1);
          }
          NODE

      - name: Exercise partial authorization and revision history
        if: env.NO_PREVIEW_WAIVER != 'true' && env.NO_PREVIEW_WAIVER_237 != 'true'
        run: |
          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-job.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"customer":{"name":"RUNTIME ESTIMATE CUSTOMER","phone":"555-0100"},"vehicle":{"year":2018,"make":"Honda","model":"Accord","mileage":88000},"requestedService":"Runtime customer estimate canary"}' \
            "$PREVIEW_URL/api/jobs/estimate-center/job" || true)"
          cat /tmp/estimate-job.json
          test "$HTTP_CODE" = "201"

          JOB_ID="$(node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/estimate-job.json', 'utf8'));
          if (!body.lifecycleNumber) process.exit(1);
          process.stdout.write(body.lifecycleNumber);
          NODE
          )"
          ENCODED_JOB_ID="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$JOB_ID")"

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-created.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"basis":"CUSTOMER_REQUEST","title":"Runtime three-item estimate","laborRate":100,"taxRate":0,"workItems":[{"description":"Front brake service","priority":"CRITICAL","partsCost":280,"laborHours":2},{"description":"Rear wheel bearing","priority":"WARNING","partsCost":320,"laborHours":3},{"description":"Valve cover leak repair","priority":"ADVISORY","partsCost":190,"laborHours":2}]}' \
            "$PREVIEW_URL/api/jobs/estimate-center/$ENCODED_JOB_ID/quick" || true)"
          cat /tmp/estimate-created.json
          test "$HTTP_CODE" = "201"

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-decisions.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"decisions":[{"itemId":"LI-001","decision":"AUTHORIZED","note":"Runtime partial authorization"},{"itemId":"LI-002","decision":"DEFERRED","note":"Runtime budget deferral"},{"itemId":"LI-003","decision":"DEFERRED","note":"Runtime budget deferral"}]}' \
            "$PREVIEW_URL/api/jobs/estimate-center/$ENCODED_JOB_ID/quick/QE-001/1/decisions" || true)"
          cat /tmp/estimate-decisions.json
          test "$HTTP_CODE" = "200"

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/estimate-decisions.json', 'utf8'));
          const failures = [];
          if (body.estimate?.status !== 'PARTIALLY_AUTHORIZED') failures.push(`status ${body.estimate?.status}`);
          if (body.totalIdentified !== 1490) failures.push(`identified ${body.totalIdentified}`);
          if (body.authorizedToday !== 480) failures.push(`authorized ${body.authorizedToday}`);
          if (body.deferred !== 1010) failures.push(`deferred ${body.deferred}`);
          if (body.estimate?.workItems?.[0]?.decision !== 'AUTHORIZED') failures.push('line 1 not authorized');
          if (body.estimate?.workItems?.[1]?.decision !== 'DEFERRED') failures.push('line 2 not deferred');
          if (failures.length) { console.error(failures.join('; ')); process.exit(1); }
          NODE

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-revision.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"laborRate":100,"taxRate":0,"workItems":[{"itemId":"LI-001","description":"Front brake service with additional hardware","priority":"CRITICAL","partsCost":300,"laborHours":2},{"itemId":"LI-002","description":"Rear wheel bearing","priority":"WARNING","partsCost":320,"laborHours":3},{"itemId":"LI-003","description":"Valve cover leak repair","priority":"ADVISORY","partsCost":190,"laborHours":2}]}' \
            "$PREVIEW_URL/api/jobs/estimate-center/$ENCODED_JOB_ID/quick/QE-001/revise" || true)"
          cat /tmp/estimate-revision.json
          test "$HTTP_CODE" = "201"

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-center.json -w '%{http_code}' \
            "$PREVIEW_URL/api/jobs/estimate-center/$ENCODED_JOB_ID" || true)"
          cat /tmp/estimate-center.json
          test "$HTTP_CODE" = "200"

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-job-state.json -w '%{http_code}' \
            "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID" || true)"
          cat /tmp/estimate-job-state.json
          test "$HTTP_CODE" = "200"

          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/estimate-ui.html -w '%{http_code}' \
            "$PREVIEW_URL/estimate-center.html" || true)"
          test "$HTTP_CODE" = "200"
          grep -q 'Estimate Center' /tmp/estimate-ui.html
          grep -q 'Total authorized today' /tmp/estimate-ui.html

          node - <<'NODE'
          const fs = require('fs');
          const center = JSON.parse(fs.readFileSync('/tmp/estimate-center.json', 'utf8'));
          const job = JSON.parse(fs.readFileSync('/tmp/estimate-job-state.json', 'utf8'));
          const failures = [];
          const r1 = center.quickEstimates?.find(x => x.documentNumber === 'QE-001-R1');
          const r2 = center.quickEstimates?.find(x => x.documentNumber === 'QE-001-R2');
          if (!r1 || !r2) failures.push('estimate revisions missing');
          if (r1?.status !== 'SUPERSEDED') failures.push(`R1 status ${r1?.status}`);
          if (r1?.workItems?.[0]?.decision !== 'AUTHORIZED') failures.push('R1 authorization history lost');
          if (r2?.workItems?.some(item => item.decision !== 'PROPOSED')) failures.push('R2 inherited old authorization');
          if (job.job?.verifiedCase) failures.push('quick estimate created VERIFIED_CASE');
          if (job.job?.estimate) failures.push('quick estimate created canonical verified estimate');
          if (job.job?.status !== 'DIAGNOSING') failures.push(`estimate-only lifecycle status ${job.job?.status}`);
          if (failures.length) { console.error(failures.join('; ')); process.exit(1); }
          console.log(`Customer estimate runtime passed: ${center.lifecycleNumber}, partial authorization retained, revision reset to PROPOSED, diagnostic truth untouched.`);
          NODE

      - name: "Audit PR #245 isolated policy bootstrap runtime success"
        if: env.ISOLATED_RUNTIME_245 == 'true' && success()
        run: |
          {
            echo '### RUNTIME VERIFIED AGAINST ISOLATED TEST SERVICE'
            echo "PR #245 exact policy head $HEAD_SHA matched the repository pin."
            echo 'Target: https://p613-backend-pr-245.onrender.com; health.ok, service name and commit matched.'
            echo 'All actual HTTP checks in this workflow passed; no runtime waiver was used.'
            echo "Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Audit PR #241/#243/#246 isolated runtime success"
        if: (env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true' || env.ISOLATED_RUNTIME_246 == 'true') && success()
        run: |
