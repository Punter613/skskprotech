name: SKSK ProTech Integration Pipeline

on:
  push:
    branches: [ main, chore/improve-writing ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      NO_PREVIEW_WAIVER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 238 && github.event.pull_request.head.sha == 'e04a7f826a6eb5e83d846d0766380a668160959e' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      NO_PREVIEW_WAIVER_237: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 237 && github.event.pull_request.head.sha == '1b51331dfaa5f48626455ee81e9f930e63fa55aa' && contains(github.event.pull_request.labels.*.name, 'no-preview') }}
      ISOLATED_RUNTIME_240: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_244: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 244 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-240-review' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_244_HEAD_SHA && vars.SKSK_ISOLATED_244_HEAD_SHA != '' }}
      ISOLATED_RUNTIME_241: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_243: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') }}
      ISOLATED_RUNTIME_245: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 245 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ci/isolated-runtime-target-241-243' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_245_HEAD_SHA && vars.SKSK_ISOLATED_245_HEAD_SHA != '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 241 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-revision-guard' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_241_HEAD_SHA && vars.SKSK_ISOLATED_241_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-241.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 243 && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'fix/job-shop-scope-empty' && github.event.pull_request.head.sha == vars.SKSK_ISOLATED_243_HEAD_SHA && vars.SKSK_ISOLATED_243_HEAD_SHA != '' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-243.onrender.com' || github.event_name == 'pull_request' && github.event.pull_request.number == 240 && github.event.pull_request.head.sha == '5a5cf160a3be1adbb236b5860228b58d77cceed7' && contains(github.event.pull_request.labels.*.name, 'isolated-runtime-test') && 'https://p613-isolated-pr-240.onrender.com' || format('https://p613-backend-pr-{0}.onrender.com', github.event.pull_request.number) }}
      SKSK_PREVIEW_API_KEY: ${{ secrets.SKSK_PREVIEW_API_KEY }}

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci || npm install

    - name: Structured Estimate Contract Checks
      run: |
        node --check src/contracts/estimate.ai.contract.js
        node --check src/core/evidence/verified.repair.resolution.js
        node --check src/core/evidence/verified.estimate.snapshot.js
        node --check src/services/ai/providers/gemini.js
        node --check src/routes/estimate.js
        test ! -e src/routes/invoice.js || { echo 'Retired generic invoice route was reintroduced'; exit 1; }
        ! grep -R "app.use('/api/invoice'" api/server.js || { echo 'Retired generic invoice mount was reintroduced'; exit 1; }
        node scripts/test-estimate-contract.js
        node scripts/test-gemini-fallback.js

    - name: Canonical Repository Test Suite
      run: npm run test:ci

    - name: Hardened OpenAPI Contract Lint
      run: npx @stoplight/spectral-cli lint openapi.yaml --ruleset .spectral.yaml --format pretty

    - name: Verify no-preview waiver is narrowly scoped
      run: node --test tests/ci.no-preview-waiver.test.js

    - name: Verify exact-head isolated runtime target policy
      run: node --test tests/ci.isolated-runtime-240.test.js

    - name: Verify pinned PR #244 bootstrap credential policy
      run: node --test tests/ci.isolated-runtime-244.test.js

    - name: Verify PR #241 and #243 isolated runtime target policy
      run: node --test tests/ci.isolated-runtime-241-243.test.js

    - name: Verify PR #245 isolated policy bootstrap
      run: node --test tests/ci.isolated-runtime-245.test.js

    - name: "Audit explicit PR #238 runtime waiver"
      if: env.NO_PREVIEW_WAIVER == 'true'
      run: |
        echo '::warning::PR #238 exact-head Render runtime checks WAIVED, not executed or verified.'
        {
          echo '### Render runtime: WAIVED — NOT VERIFIED'
          echo 'PR #238 at reviewed head e04a7f826a6eb5e83d846d0766380a668160959e; explicit no-preview label.'
          echo 'Reason: Render previews suspended after inheriting production database credentials.'
          echo 'Only live-preview checks are waived; deterministic, contract, test, lint, and build checks remain mandatory.'
          echo 'See .github/NO_PREVIEW_WAIVER.md. No HTTP failure can grant this waiver.'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: "Audit explicit PR #237 startup-guard waiver"
      if: env.NO_PREVIEW_WAIVER_237 == 'true'
      run: |
        echo '::warning::PR #237 STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME WAIVED, NOT VERIFIED.'
        {
          echo '### PR #237: STARTUP GUARD VERIFIED — FULL APPLICATION RUNTIME NOT VERIFIED'
          echo 'Reviewed exact head: 1b51331dfaa5f48626455ee81e9f930e63fa55aa; explicit owner-applied no-preview label.'
          echo 'Isolated Render service: p613-isolated-pr-237; production URL + fabricated JWT refused before binding (exit 1).'
          echo 'Approved test-ref startup also logged; no valid Supabase key was used.'
          echo 'Evidence: https://github.com/Punter613/skskprotech/pull/237#issuecomment-6999629745'
          echo 'Only preview-dependent HTTP steps waived. Deterministic checks remain mandatory; no 404 or timeout can grant this waiver.'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: "Select exact-head PR #240 isolated runtime target"
      if: env.ISOLATED_RUNTIME_240 == 'true'
      env:
        ISOLATED_240_API_KEY: ${{ secrets.SKSK_ISOLATED_240_API_KEY }}
      run: |
        if [ -z "$ISOLATED_240_API_KEY" ]; then
          echo "::error::SKSK_ISOLATED_240_API_KEY is missing; refusing to fall back to the default preview key."
          exit 1
        fi
        echo "SKSK_PREVIEW_API_KEY=$ISOLATED_240_API_KEY" >> "$GITHUB_ENV"
        echo '::notice::PR #240 isolated test target selected; runtime verification pending.'
        {
          echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
          echo 'PR #240 exact head 5a5cf160a3be1adbb236b5860228b58d77cceed7; test-only service https://p613-isolated-pr-240.onrender.com.'
          echo 'No HTTP runtime checks are waived. The selected target must pass exact commit and service-identity checks.'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: "Select pinned PR #241/#243 isolated runtime credential"
      if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true'
      env:
        ISOLATED_241_API_KEY: ${{ secrets.SKSK_ISOLATED_241_API_KEY }}
        ISOLATED_243_API_KEY: ${{ secrets.SKSK_ISOLATED_243_API_KEY }}
      run: |
        case "${ISOLATED_RUNTIME_241}:${ISOLATED_RUNTIME_243}" in
          true:false) TEST_KEY="$ISOLATED_241_API_KEY"; TARGET_PR=241 ;;
          false:true) TEST_KEY="$ISOLATED_243_API_KEY"; TARGET_PR=243 ;;
          *) echo '::error::Ambiguous isolated runtime selector; refusing credential selection.'; exit 1 ;;
        esac
        if [ -z "$TEST_KEY" ]; then
          echo "::error::SKSK_ISOLATED_${TARGET_PR}_API_KEY missing; refusing shared preview-key fallback."
          exit 1
        fi
        printf 'SKSK_PREVIEW_API_KEY=%s\n' "$TEST_KEY" >> "$GITHUB_ENV"
        echo "::notice::PR #${TARGET_PR} dedicated test credential selected; runtime verification pending."
        {
          echo '### ISOLATED TEST TARGET SELECTED — NOT YET VERIFIED'
          echo "PR #${TARGET_PR} at pinned head $HEAD_SHA; target $PREVIEW_URL."
          echo 'Every real HTTP assertion remains mandatory. No runtime waiver is enabled.'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: "Select pinned PR #245 isolated policy bootstrap credential"
      if: env.ISOLATED_RUNTIME_245 == 'true'
      env:
        ISOLATED_245_API_KEY: ${{ secrets.SKSK_ISOLATED_245_API_KEY }}
      run: |
        if [ -z "$ISOLATED_245_API_KEY" ]; then
          echo '::error::SKSK_ISOLATED_245_API_KEY missing; refusing shared preview-key fallback.'
          exit 1
        fi
        printf 'SKSK_PREVIEW_API_KEY=%s\n' "$ISOLATED_245_API_KEY" >> "$GITHUB_ENV"
        echo '::notice::PR #245 pinned bootstrap credential selected; live verification pending.'
        {
          echo '### PR #245 POLICY BOOTSTRAP SELECTED — NOT YET VERIFIED'
          echo "PR #245 at exact head $HEAD_SHA, pinned by SKSK_ISOLATED_245_HEAD_SHA."
          echo 'Test-only service https://p613-backend-pr-245.onrender.com; no runtime waiver.'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: "Select pinned PR #244 isolated bootstrap credential"
      if: env.ISOLATED_RUNTIME_244 == 'true'
      env:
        ISOLATED_244_API_KEY: ${{ secrets.SKSK_ISOLATED_244_API_KEY }}
      run: |
        if [ -z "$ISOLATED_244_API_KEY" ]; then
          echo "::error::SKSK_ISOLATED_244_API_KEY missing; refusing shared preview-key fallback."
          exit 1
        fi
        echo "SKSK_PREVIEW_API_KEY=$ISOLATED_244_API_KEY" >> "$GITHUB_ENV"
        echo '::notice::PR #244 pinned test credential selected; runtime verification pending.'
        {
          echo '### PR #244 BOOTSTRAP TARGET SELECTED — NOT YET VERIFIED'
          echo "PR #244 exact head $HEAD_SHA, pinned by repository variable SKSK_ISOLATED_244_HEAD_SHA."
          echo 'Test-only service https://p613-backend-pr-244.onrender.com; no runtime waiver.'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: "Verify PR #245 isolated policy bootstrap identity"
      if: env.ISOLATED_RUNTIME_245 == 'true'
      run: |
        HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-245-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::PR #245 bootstrap health unavailable (HTTP $HTTP_CODE)."; exit 1
        fi
        HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('node:fs');
        const health = JSON.parse(fs.readFileSync('/tmp/pr-245-isolated-health.json', 'utf8'));
        if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-245') {
          console.error('PR #245 bootstrap identity, health or exact head mismatch; refusing runtime verification.');
          process.exit(1);
        }
        NODE
    - name: "Verify PR #241/#243 isolated service identity"
      if: env.ISOLATED_RUNTIME_241 == 'true' || env.ISOLATED_RUNTIME_243 == 'true'
      run: |
        HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-241-243-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Isolated runtime health unavailable (HTTP $HTTP_CODE)."; exit 1
        fi
        HEAD_SHA="$HEAD_SHA" ISOLATED_RUNTIME_241="$ISOLATED_RUNTIME_241" node - <<'NODE'
        const fs = require('node:fs');
        const health = JSON.parse(fs.readFileSync('/tmp/pr-241-243-isolated-health.json', 'utf8'));
        const service = process.env.ISOLATED_RUNTIME_241 === 'true' ? 'p613-isolated-pr-241' : 'p613-isolated-pr-243';
        if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== service) {
          console.error('Isolated service name, exact head, or runtime health mismatch; refusing verification.');
          process.exit(1);
        }
        NODE
    - name: "Verify PR #240 isolated service identity"
      if: env.ISOLATED_RUNTIME_240 == 'true'
      run: |
        HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-240-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::PR #240 isolated runtime health unavailable (HTTP $HTTP_CODE)."
          exit 1
        fi
        HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('node:fs');
        const health = JSON.parse(fs.readFileSync('/tmp/pr-240-isolated-health.json', 'utf8'));
        if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-isolated-pr-240') {
          console.error('Isolated test service identity or exact commit did not match; refusing runtime verification.');
          process.exit(1);
        }
        NODE

    - name: "Verify PR #244 isolated test service identity"
      if: env.ISOLATED_RUNTIME_244 == 'true'
      run: |
        HTTP_CODE="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/pr-244-isolated-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::PR #244 isolated test service health unavailable (HTTP $HTTP_CODE)."
          exit 1
        fi
        HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('node:fs');
        const health = JSON.parse(fs.readFileSync('/tmp/pr-244-isolated-health.json', 'utf8'));
        if (health?.ok !== true || health?.preview?.commit !== process.env.HEAD_SHA || health?.preview?.service !== 'p613-backend-pr-244') {
          console.error('PR #244 test service identity or exact commit mismatch; runtime is not verified.');
          process.exit(1);
        }
        NODE

    - name: Render PR Runtime Evidence Smoke
      if: github.event_name == 'pull_request' && env.NO_PREVIEW_WAIVER != 'true' && env.NO_PREVIEW_WAIVER_237 != 'true'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA" || true
        CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"
        echo "$CHANGED_FILES"

        EVIDENCE_CHANGED=0
        UNVERIFIED_CHANGED=0
        MANUAL_REUSE_CHANGED=0
        TEST_EVIDENCE_CHANGED=0

        if echo "$CHANGED_FILES" | grep -Eq '^(api/server\.js$|src/services/(lemon|lemon\.worker|lemon\.path\.resolver|vehicle\.warmup|vin)\.js$|src/workers/lemonTargetedWorker\.js$|scripts/scrape-lemon-targeted-evidence\.js$|src/core/knowledge/(quick\.ask\.(retriever|bounded)|dtc\.retrieval\.intent)\.js$|src/routes/(quick\.ask|vehicle)\.js$)'; then
          EVIDENCE_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(src/db\.js$|src/services/manual\.evidence\.reuse\.js$)'; then
          EVIDENCE_CHANGED=1
          MANUAL_REUSE_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(api/server\.js$|public/lifecycle\.html$|src/services/(job\.lifecycle|diagnostic\.reassessment)\.js$|src/core/evidence/(unverified\.diagnosis|verified\.case)\.js$|src/routes/(jobs|jobs\.protected)\.js$)'; then
          UNVERIFIED_CHANGED=1
        fi

        if echo "$CHANGED_FILES" | grep -Eq '^(src/services/job\.lifecycle\.js$|src/core/evidence/verified\.case\.js$|src/routes/jobs\.protected\.js$|public/lifecycle\.html$)'; then
          TEST_EVIDENCE_CHANGED=1
        fi

        # A policy-only PR must prove real runtime instead of exiting early
        # because no application source file changed.
        if [ "$ISOLATED_RUNTIME_245" = 'true' ]; then
          EVIDENCE_CHANGED=1
          UNVERIFIED_CHANGED=1
          TEST_EVIDENCE_CHANGED=1
        fi

        echo "Runtime canaries: evidence=$EVIDENCE_CHANGED manualReuse=$MANUAL_REUSE_CHANGED unverified=$UNVERIFIED_CHANGED testEvidence=$TEST_EVIDENCE_CHANGED"

        if [ "$EVIDENCE_CHANGED" != "1" ] && [ "$UNVERIFIED_CHANGED" != "1" ]; then
          echo "No affected runtime canary lane; Render preview smoke skipped."
          exit 0
        fi

        echo "Waiting for exact Render preview head $HEAD_SHA at $PREVIEW_URL"
        MATCHED=0
        REACHABLE=0
        for attempt in $(seq 1 36); do
          HTTP_CODE="$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/render-health.json -w '%{http_code}' "$PREVIEW_URL/health" || true)"
          if [ "$HTTP_CODE" = "200" ]; then
            REACHABLE=1
            if HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const health = JSON.parse(fs.readFileSync('/tmp/render-health.json', 'utf8'));
        if (health?.preview?.commit === process.env.HEAD_SHA) process.exit(0);
        process.exit(1);
        NODE
            then
              MATCHED=1
              break
            fi
          fi
          echo "Preview not on exact head yet (attempt $attempt/36, HTTP $HTTP_CODE)."
          sleep 5
        done

        if [ "$MATCHED" != "1" ]; then
          if [ "$REACHABLE" != "1" ]; then
            echo "::error::Required Render PR preview is unavailable at $PREVIEW_URL. Runtime verification is mandatory for this affected lane; do not merge."
          else
            echo "::error::Render preview was reachable but never reached exact PR head $HEAD_SHA."
          fi
          cat /tmp/render-health.json 2>/dev/null || true
          exit 1
        fi

        if [ "$EVIDENCE_CHANGED" = "1" ]; then
          SMOKE_URL="$PREVIEW_URL/health/preview-evidence?vin=5XXGT4L38LG384941&query=P1326%20knock%20signal%20range%20performance%20flashing%20MIL%20reduced%20power"
          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/render-evidence-smoke.json -w '%{http_code}' "$SMOKE_URL" || true)"
          cat /tmp/render-evidence-smoke.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Render preview evidence smoke failed with HTTP $HTTP_CODE."
            exit 1
          fi

          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-evidence-smoke.json', 'utf8'));
        const failures = [];
        if (smoke.ok !== true) failures.push('smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('runtime commit mismatch');
        if (smoke.decode?.statusCode !== 200) failures.push(`decode HTTP ${smoke.decode?.statusCode}`);
        if (smoke.quickAsk?.statusCode !== 200) failures.push(`Quick Ask HTTP ${smoke.quickAsk?.statusCode}`);
        if (smoke.quickAsk?.status !== 'SUCCESS') failures.push(`Quick Ask status ${smoke.quickAsk?.status}`);
        if (Number(smoke.quickAsk?.ms || Infinity) > 40000) failures.push(`Quick Ask latency ${smoke.quickAsk?.ms}ms exceeded 40000ms ceiling`);
        const titles = Array.isArray(smoke.quickAsk?.referenceTitles) ? smoke.quickAsk.referenceTitles : [];
        if (titles.some(title => /(?:^|\D)1\.6\s*L\b/i.test(String(title)))) failures.push('known 2.4L Optima surfaced explicit 1.6L manual reference');
        const warnings = Array.isArray(smoke.quickAsk?.warnings) ? smoke.quickAsk.warnings : [];
        if (!warnings.some(w => /DTC-anchored retrieval active for P1326/i.test(String(w)))) failures.push('P1326 runtime did not enter DTC-anchored retrieval');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Render evidence smoke passed: decode=${smoke.decode.ms}ms quickAsk=${smoke.quickAsk.ms}ms total=${smoke.totalMs}ms refs=${smoke.quickAsk.repairDiagnosisReferenceCount}`);
        NODE

          if [ "$MANUAL_REUSE_CHANGED" = "1" ]; then
            REUSE_URL="$PREVIEW_URL/health/preview-evidence?vin=KNDJC736385765089&query=P0300%20P0171%20random%20misfire%20lean%20bank%201%20deceleration%20full%20lock%20clunk"
            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 45 -sS -o /tmp/render-manual-reuse-smoke.json -w '%{http_code}' "$REUSE_URL" || true)"
            cat /tmp/render-manual-reuse-smoke.json || true
            echo

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Render manual-reuse smoke failed with HTTP $HTTP_CODE."
              exit 1
            fi

            HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-manual-reuse-smoke.json', 'utf8'));
        const failures = [];
        const manual = smoke.quickAsk?.retrievalTelemetry?.manual || {};
        if (smoke.ok !== true) failures.push('reuse smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('reuse runtime commit mismatch');
        if (smoke.decode?.statusCode !== 200) failures.push(`reuse decode HTTP ${smoke.decode?.statusCode}`);
        if (!/sorento/i.test(String(smoke.decode?.vehicle?.model || ''))) failures.push(`reuse decoded model ${smoke.decode?.vehicle?.model}`);
        if (smoke.quickAsk?.statusCode !== 200 || smoke.quickAsk?.status !== 'SUCCESS') failures.push('reuse Quick Ask did not succeed');
        if (manual.timedOut === true) failures.push('reuse manual retrieval timed out');
        if (smoke.quickAsk?.repairDiagnosisFromCache !== true) failures.push('reuse manual evidence did not come from stored cache');
        if (Number(manual.elapsedMs || Infinity) > 5000) failures.push(`reuse manual latency ${manual.elapsedMs}ms exceeded 5000ms target`);
        if (Number(smoke.quickAsk?.repairDiagnosisReferenceCount || 0) < 1) failures.push('reuse produced no focused manual references');
        const warnings = Array.isArray(smoke.quickAsk?.warnings) ? smoke.quickAsk.warnings : [];
        if (!warnings.some(w => /DTC-anchored retrieval active for P0300, P0171/i.test(String(w)))) failures.push('reuse runtime did not keep P0300/P0171 DTC anchors');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Render manual reuse passed: manual=${manual.elapsedMs}ms total=${smoke.quickAsk.ms}ms refs=${smoke.quickAsk.repairDiagnosisReferenceCount} fromCache=${smoke.quickAsk.repairDiagnosisFromCache}`);
        NODE
          fi
        else
          echo "Evidence/Quick Ask hot path unchanged; evidence canary skipped."
        fi

        if [ "$UNVERIFIED_CHANGED" = "1" ]; then
          UNVERIFIED_URL="$PREVIEW_URL/health/preview-unverified-diagnosis"
          HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 20 -sS -o /tmp/render-unverified-smoke.json -w '%{http_code}' "$UNVERIFIED_URL" || true)"
          cat /tmp/render-unverified-smoke.json || true
          echo

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Render preview unverified diagnosis smoke failed with HTTP $HTTP_CODE."
            exit 1
          fi

          HEAD_SHA="$HEAD_SHA" node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-unverified-smoke.json', 'utf8'));
        const failures = [];
        if (smoke.ok !== true) failures.push('unverified smoke.ok !== true');
        if (smoke.runtime?.commit !== process.env.HEAD_SHA) failures.push('unverified runtime commit mismatch');
        if (smoke.fallback?.statusCode !== 200) failures.push(`fallback HTTP ${smoke.fallback?.statusCode}`);
        if (smoke.fallback?.diagnosisState !== 'UNVERIFIED_DIAGNOSIS') failures.push(`fallback state ${smoke.fallback?.diagnosisState}`);
        if (smoke.fallback?.physicallyVerified !== false) failures.push('fallback physicallyVerified must be false');
        if (smoke.fallback?.repairAuthorized !== false) failures.push('fallback repairAuthorized must be false');
        if (smoke.fallback?.estimateReady !== false) failures.push('fallback estimateReady must be false');
        if (smoke.persisted?.status !== 'TESTING') failures.push(`persisted status ${smoke.persisted?.status}`);
        if (smoke.persisted?.hasVerifiedCase !== false) failures.push('fallback unexpectedly created VERIFIED_CASE');
        if (smoke.estimateBypassAttempt?.statusCode !== 409) failures.push(`estimate bypass HTTP ${smoke.estimateBypassAttempt?.statusCode}`);
        if (smoke.ui?.hasFallback !== true) failures.push('rendered lifecycle page missing fallback UI');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Unverified diagnosis runtime smoke passed: fallback=${smoke.fallback.ms}ms state=${smoke.fallback.diagnosisState} estimateBypass=${smoke.estimateBypassAttempt.statusCode} UI=${smoke.ui.hasFallback}`);
        NODE

          if [ "$TEST_EVIDENCE_CHANGED" = "1" ]; then
            JOB_ID="$(node - <<'NODE'
        const fs = require('fs');
        const smoke = JSON.parse(fs.readFileSync('/tmp/render-unverified-smoke.json', 'utf8'));
        if (!smoke.jobId) process.exit(1);
        process.stdout.write(smoke.jobId);
        NODE
        )"
            ENCODED_JOB_ID="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$JOB_ID")"
            echo "Verification-evidence runtime job: $JOB_ID"

            for PLACEHOLDER in '(unknown)' '“unknown.”' 'unknown…'; do
              BODY="$(PLACEHOLDER="$PLACEHOLDER" node -e 'process.stdout.write(JSON.stringify({name:"Runtime placeholder evidence",result:process.env.PLACEHOLDER}))')"
              HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-placeholder-test.json -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' --data "$BODY" \
                "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/tests" || true)"
              cat /tmp/render-placeholder-test.json || true
              echo
              if [ "$HTTP_CODE" != "409" ]; then
                echo "Punctuated placeholder ${PLACEHOLDER} was not rejected; HTTP $HTTP_CODE."
                exit 1
              fi
            done

            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-verify-no-evidence.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"confirmed":true,"confirmedCause":"Knock sensor circuit signal fault","conclusion":"Runtime verification must bind persisted evidence.","evidenceTestIds":["missing-test"]}' \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/verify" || true)"
            cat /tmp/render-verify-no-evidence.json || true
            echo
            if [ "$HTTP_CODE" != "409" ]; then
              echo "VERIFY without persisted evidence was not rejected; HTTP $HTTP_CODE."
              exit 1
            fi

            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-neutral-test.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"name":"Road-test operating-condition observation","result":"Mechanical impact reproduced during throttle release; exact failed component was not isolated.","evidenceRole":"NEUTRAL"}' \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/tests" || true)"
            cat /tmp/render-neutral-test.json || true
            echo
            if [ "$HTTP_CODE" != "201" ]; then
              echo "Neutral mechanic observation was not accepted; HTTP $HTTP_CODE."
              exit 1
            fi

            NEUTRAL_TEST_ID="$(node - <<'NODE'
        const fs = require('fs');
        const body = JSON.parse(fs.readFileSync('/tmp/render-neutral-test.json', 'utf8'));
        if (!body.test?.id || body.test?.evidenceRole !== 'NEUTRAL') process.exit(1);
        process.stdout.write(body.test.id);
        NODE
        )"

            NEUTRAL_TEST_ID="$NEUTRAL_TEST_ID" node - <<'NODE'
        const fs = require('fs');
        fs.writeFileSync('/tmp/render-neutral-verify-body.json', JSON.stringify({
          confirmed: true,
          confirmedCause: 'Knock sensor circuit signal fault',
          conclusion: 'This neutral road-test observation must not be sufficient to verify a component fault.',
          evidenceTestIds: [process.env.NEUTRAL_TEST_ID]
        }));
        NODE

            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-neutral-verify.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data-binary @/tmp/render-neutral-verify-body.json \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/verify" || true)"
            cat /tmp/render-neutral-verify.json || true
            echo
            if [ "$HTTP_CODE" != "409" ]; then
              echo "Neutral evidence incorrectly unlocked VERIFY; HTTP $HTTP_CODE."
              exit 1
            fi

            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-valid-test.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' \
              --data '{"name":"Knock sensor circuit confirmation test","result":"Circuit measurement failed the applicable confirmation limit and isolated the fault to the knock sensor circuit.","evidenceRole":"CONFIRMS","confirmedFault":"Knock sensor circuit signal fault"}' \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/tests" || true)"
            cat /tmp/render-valid-test.json || true
            echo
            if [ "$HTTP_CODE" != "201" ]; then
              echo "Confirmation-grade observation was not accepted; HTTP $HTTP_CODE."
              exit 1
            fi

            TEST_ID="$(node - <<'NODE'
        const fs = require('fs');
        const body = JSON.parse(fs.readFileSync('/tmp/render-valid-test.json', 'utf8'));
        if (!body.test?.id || body.test?.evidenceRole !== 'CONFIRMS' || body.test?.confirmedFault !== 'Knock sensor circuit signal fault') process.exit(1);
        process.stdout.write(body.test.id);
        NODE
        )"

            TEST_ID="$TEST_ID" node - <<'NODE'
        const fs = require('fs');
        fs.writeFileSync('/tmp/render-valid-verify-body.json', JSON.stringify({
          confirmed: true,
          confirmedCause: 'Knock sensor circuit signal fault',
          conclusion: 'The recorded circuit measurement failed the confirmation limit and isolated the same named fault.',
          evidenceTestIds: [process.env.TEST_ID]
        }));
        NODE

            HTTP_CODE="$(curl -H "X-SKSK-API-Key: $SKSK_PREVIEW_API_KEY" --connect-timeout 5 --max-time 15 -sS -o /tmp/render-valid-verify.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data-binary @/tmp/render-valid-verify-body.json \
              "$PREVIEW_URL/api/jobs/$ENCODED_JOB_ID/verify" || true)"
            cat /tmp/render-valid-verify.json || true
            echo
            if [ "$HTTP_CODE" != "200" ]; then
              echo "Normal VERIFY path failed with HTTP $HTTP_CODE."
              exit 1
            fi

            TEST_ID="$TEST_ID" node - <<'NODE'
        const fs = require('fs');
        const body = JSON.parse(fs.readFileSync('/tmp/render-valid-verify.json', 'utf8'));
        const failures = [];
        if (body.status !== 'VERIFIED') failures.push(`status ${body.status}`);
        if (body.estimateReady !== true) failures.push('estimateReady !== true');
        if (!body.verifiedCase) failures.push('VERIFIED_CASE missing');
        if (!Array.isArray(body.verification?.evidenceTestIds) || !body.verification.evidenceTestIds.includes(process.env.TEST_ID)) failures.push('selected confirmation test not bound to verification');
        if (body.verifiedCase?.tests?.find(test => test.id === process.env.TEST_ID)?.evidenceRole !== 'CONFIRMS') failures.push('VERIFIED_CASE did not freeze confirmation evidence role');
        if (failures.length) {
          console.error(failures.join('; '));
          process.exit(1);
        }
        console.log(`Verification-evidence runtime smoke passed: placeholders=409, missing-evidence verify=409, neutral=201 but neutral verify=409, confirms=201, verify=200 VERIFIED, test=${process.env.TEST_ID}`);
        NODE
          fi
        else
          echo "Unverified-diagnosis/lifecycle hot path unchanged; unverified canary skipped."
        fi

